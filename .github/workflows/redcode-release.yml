name: release
run-name: "${{ format('release {0}', inputs.version || github.ref_name) }}"

# Builds the RedCode CLI for every supported platform on GitHub-hosted runners, packs the npm
# tarballs and standalone archives, publishes the packages to npm and attaches the archives to a
# GitHub Release. Runs on `v*` tags and on manual dispatch.
#
# Each platform builds in its own job: a single job building all 12 targets overflows the
# GitHub-hosted runner disk with `ENOSPC` (upstream runs the equivalent on larger runners).
#
# Publishing needs the repository secret NPM_TOKEN (an npm automation token with publish access to
# the `redcode-ai` package). Without it the npm step fails before anything is uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to the pushed tag, or the packages/cli version)"
        required: false
        type: string
      release_notes:
        description: "Release notes for the GitHub Release"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./packages/cli/package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-arm64
          - linux-x64
          - linux-x64-baseline
          - linux-arm64-musl
          - linux-x64-musl
          - linux-x64-baseline-musl
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - windows-arm64
          - windows-x64
          - windows-x64-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Not the shared .github/actions/setup-bun composite action: it hard-codes
      # `bun install --frozen-lockfile`, and the rebrand changed every workspace package name.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Fetch the models.dev catalog
        run: bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json

      - name: Build redcode-ai-${{ matrix.target }}
        working-directory: packages/cli
        run: bun run build && rm -rf dist/.bun
        env:
          REDCODE_CHANNEL: latest
          REDCODE_VERSION: ${{ needs.plan.outputs.version }}
          REDCODE_RELEASE_NOTES: ${{ inputs.release_notes }}
          REDCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json
          REDCODE_TARGET: ${{ matrix.target }}
          BUN_COMPILE_RELEASE: bun-v1.4.4
          # Read-only, only raises the rate limit for Bun release downloads.
          GH_TOKEN: ${{ github.token }}

      - name: Upload redcode-ai-${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: packages/cli/dist/redcode-ai-${{ matrix.target }}
          if-no-files-found: error

  pack:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Download every platform build
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: packages/cli/dist
          merge-multiple: true

      - name: Pack npm tarballs and standalone archives
        run: bun run pack
        env:
          REDCODE_CHANNEL: latest
          REDCODE_VERSION: ${{ needs.plan.outputs.version }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The NPM_TOKEN repository secret is not set." >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"

          publish() {
            local tarball="$1"
            local base
            base="$(basename "$tarball")"
            local name="${base%-$VERSION.tgz}"
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "skip ${name}@${VERSION} (already published)"
              return
            fi
            echo "publish ${name}@${VERSION}"
            npm publish "$tarball" --access public --tag latest
          }

          # Platform packages first, then the wrapper packages that depend on them.
          for tarball in dist/npm/redcode-ai-*.tgz; do
            case "$(basename "$tarball")" in
              "redcode-ai-$VERSION.tgz" | "redcode-ai-node-$VERSION.tgz") continue ;;
            esac
            publish "$tarball"
          done
          for wrapper in "dist/npm/redcode-ai-node-$VERSION.tgz" "dist/npm/redcode-ai-$VERSION.tgz"; do
            [ -f "$wrapper" ] && publish "$wrapper"
          done

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create "v${VERSION}" \
            dist/archives/* dist/npm/redcode-ai-*.tgz \
            --title "RedCode v${VERSION}" \
            --notes "${NOTES:-RedCode v${VERSION}}"
